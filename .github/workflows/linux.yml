name: Linux (port in progress)

# This package has never built on Linux, and this job exists to make that
# statement falsifiable rather than remembered.
#
# Why it exists at all: a Linux user pointed a Swift 6.2 toolchain at the
# package on 2026-09-29 and got two failures in a row that nothing here could
# have predicted, because macOS compiles neither of the paths involved. The
# README now says "macOS only, today" — this job is what would let that
# sentence change, and what would stop it silently becoming false again.
#
# Trigger is workflow_dispatch ONLY, deliberately, and stays that way until the
# job is green. A red X on every push to a public repository whose subject is
# code quality is worse than no signal: it trains the reader to ignore the tick.
# Flip to `push` in the same commit that turns this green — not before, and not
# as a separate tidy-up nobody schedules.
#
# Billing: ubuntu-latest is 1× and free for public repositories, so unlike
# hosted macOS (10× on private, the reason quality-gate.yml is self-hosted)
# there is no economic argument against running this on every push once it
# passes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: swift build (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.2 is the manifest's swift-tools-version and what the reporting
        # user runs. Nothing below it can parse Package.swift at all.
        swift: ["6.2"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        run: |
          swift --version
          echo "libdispatch headers:"
          ls -la /usr/lib/swift/dispatch/dispatch.h /usr/lib/swift/Block.h || true

      # indexstore-db's Concurrency-Mac.cpp includes <dispatch/dispatch.h> and
      # <Block.h> with no platform guard and is not excluded on non-Apple
      # platforms, so it compiles here and fails unless clang is told where the
      # toolchain keeps them. SwiftPM does not add the Swift toolchain's include
      # paths to C++ targets on its own. This is an upstream gap, not a local
      # misconfiguration: the same two flags are what got a real Linux box past
      # it. If indexstore-db ever guards that file, these flags become inert
      # rather than wrong.
      - name: Build
        run: |
          swift build -c release \
            -Xcxx -I/usr/lib/swift \
            -Xcxx -I/usr/lib/swift/Block

      # The doc checkers are 58 of the remaining failures and they fail by *finding
      # nothing* or by attributing a compile error to the wrong article line — neither
      # of which can be reproduced on macOS, because both depend on what this platform's
      # swiftc actually prints. So ask it, and print the answer, before running the suite.
      - name: Diagnose — what swiftc reports here
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > main.swift <<'SWIFT'
          import Foundation
          func greet(name: String) -> String { "hello, \(name)" }
          print(greet(person: "Ada"))
          SWIFT
          echo "--- swiftc --version"
          swiftc --version
          echo "--- compiling a 3-line program whose error is on line 3"
          swiftc -swift-version 6 main.swift -o /tmp/probe/out 2>&1 | head -20 || true
          echo "--- toolchain layout the auditor probes for"
          command -v swiftc
          ls -d "$(dirname "$(dirname "$(command -v swiftc)")")"/lib/swift/host/plugins/testing 2>/dev/null || echo "  no plugin dir"
          ls -d "$(dirname "$(dirname "$(command -v swiftc)")")"/lib/swift/pm/ManifestAPI 2>/dev/null || echo "  no ManifestAPI dir"

      - name: Test
        run: |
          swift test \
            -Xcxx -I/usr/lib/swift \
            -Xcxx -I/usr/lib/swift/Block
