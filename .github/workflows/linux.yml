name: Linux

# Linux is a supported platform, and this job is what makes that statement
# falsifiable rather than remembered.
#
# It began as `workflow_dispatch` only, on the reasoning that a red X on every
# push to a public repository about code quality is worse than no signal. That
# was right about the cost and wrong about the risk. Being opt-in, nothing
# dispatched it — and `main` sat unbuildable on Linux through fourteen merged
# pull requests, each with a green gate, because the pre-push gate runs the
# local toolchain and the local toolchain compiled the line that CI could not.
# A signal nobody triggers is not a cautious signal; it is an absent one.
#
# It therefore runs on pull requests as well as pushes. The pull-request trigger
# is the one that matters: the break arrived *through* a PR, so a push-only job
# would have reported it one commit after `main` was already broken. Catching it
# on the PR is the difference between a gate and a post-mortem.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. A superseded PR revision tells you nothing, and this job is
  # long enough that stacked runs would queue behind each other.
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately, and neither is redundant.
        #
        # 6.2 is the manifest's `swift-tools-version` and what the README
        # promises. Testing only the newer toolchain would leave that promise
        # unverified — and it is exactly what broke: `ambiguous use of
        # 'reversed()'` is legal in 6.4 and an error in 6.2, so a 6.4-only job
        # would have reported the same green as the macOS gate did.
        #
        # 6.4 is what development runs. Testing only the floor would let a
        # regression that affects contributors ship unnoticed.
        #
        # ubuntu-latest is 1x and free for public repositories, so the second
        # job costs wall time and nothing else.
        swift: ["6.2", "6.4"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        run: |
          swift --version
          echo "libdispatch headers:"
          ls -la /usr/lib/swift/dispatch/dispatch.h /usr/lib/swift/Block.h || true

      # indexstore-db's Concurrency-Mac.cpp includes <dispatch/dispatch.h> and
      # <Block.h> with no platform guard and is not excluded on non-Apple
      # platforms, so it compiles here and fails unless clang is told where the
      # toolchain keeps them. SwiftPM does not add the Swift toolchain's include
      # paths to C++ targets on its own. This is an upstream gap, not a local
      # misconfiguration: the same two flags are what got a real Linux box past
      # it. If indexstore-db ever guards that file, these flags become inert
      # rather than wrong.
      - name: Build
        run: |
          swift build -c release \
            -Xcxx -I/usr/lib/swift \
            -Xcxx -I/usr/lib/swift/Block

      - name: Test
        run: |
          swift test \
            -Xcxx -I/usr/lib/swift \
            -Xcxx -I/usr/lib/swift/Block
