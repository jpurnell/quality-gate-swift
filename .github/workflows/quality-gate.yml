name: Quality Gate (Self)

# quality-gate-swift dogfoods itself — every improvement is validated
# against its own codebase before it can propagate to consuming projects.
#
# Phase 2 migration (2026-07-10): the previous version of this workflow ran
# on GitHub-hosted macos-latest and was disabled "to conserve GitHub Actions
# minutes" — the 10× private-repo multiplier in action. It now targets
# self-hosted runners (Phase2_CIParity.md §3b: hosted macOS on private repos,
# never) and uses the canonical `quality-gate ci` entrypoint, so this run is
# byte-for-byte the local gate (CIParityTests proves it). The hand-rolled
# corpus checkout/push (PAT + retry loop) is replaced by
# `ci --corpus-remote` with a write-scoped deploy key (§4) — same semantics,
# one implementation, tested.
#
# Trigger stays workflow_dispatch until a self-hosted runner is registered —
# a push trigger with no live runner queues every push (~24h) and reads as
# failure. Flip to push/PR once Settings → Actions → Runners shows a healthy
# runner (§3c).

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF upload to code scanning
  # codeql-action reads GET /repos/{o}/{r}/actions/runs/{id} to stamp the upload
  # with run metadata. On a PRIVATE repository that call needs `actions: read`,
  # and without it the step fails *after* validating and fingerprinting the SARIF
  # — "Resource not accessible by integration", which reads like a code-scanning
  # entitlement problem and is not one.
  actions: read

jobs:
  quality-gate:
    runs-on: [self-hosted, macos, quality-gate]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build quality-gate (this repo IS the gate)
        run: swift build -c release --product quality-gate

      - name: Run quality-gate ci
        run: .build/release/quality-gate ci --output-dir .quality-gate-ci

      - name: Upload SARIF
        if: always()
        # Code scanning is free on public repositories and requires GitHub Advanced
        # Security on private ones, which a personal account cannot buy — the write
        # endpoint is 404, not 403, so the feature is absent here rather than off.
        # Without this the step fails the whole job for a reason that has nothing to
        # do with code quality, which is worse than not uploading: a red run stops
        # meaning "the gate found something". The SARIF is still produced and the
        # summary artifact below still carries every finding.
        #
        # Left in place rather than deleted: it starts working by itself the day this
        # repository goes public, which is already the fix for two other things —
        # public repos cannot call a reusable workflow that lives in a private one,
        # and consumers would stop needing a token to clone the gate at all.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .quality-gate-ci/quality-gate.sarif

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-summary
          path: .quality-gate-ci/
