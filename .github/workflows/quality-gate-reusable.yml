name: Quality Gate (Reusable)

# Reusable workflow for any project using quality-gate-swift.
# Always builds from latest main — improvements propagate automatically.
#
# Basic usage (run default checkers):
#
#   jobs:
#     quality-gate:
#       uses: jpurnell/quality-gate-swift/.github/workflows/quality-gate-reusable.yml@main
#
# Daily audit with telemetry (run all checkers, push to corpus):
#
#   on:
#     schedule:
#       - cron: '0 6 * * *'
#     push:
#       branches: [main]
#
#   jobs:
#     quality-gate:
#       uses: jpurnell/quality-gate-swift/.github/workflows/quality-gate-reusable.yml@main
#       with:
#         checks: "all"
#         continue-on-failure: true
#         corpus-repo: jpurnell/org-judgement-corpus
#       secrets:
#         corpus-deploy-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
#
# Two credentials, two jobs — they were one PAT until 2026-09-05 and that
# conflation is why a corpus-scoped token sat in an `insteadOf` rewrite aimed
# at every dependency host:
#
#   corpus-deploy-key  SSH key, write-scoped to the corpus repo alone (§4).
#                      Reaches exactly one repository, which is the point.
#   dependency-token   HTTPS PAT with *read* on private SPM dependencies.
#                      Only needed if `swift build` resolves private URLs.
#
# A deploy key cannot authorize dependency fetches and a dependency token
# should never hold corpus write. Pass whichever the repo actually needs.

on:
  workflow_call:
    inputs:
      checks:
        description: "Space-separated checker IDs to run ('all' for every checker)"
        type: string
        required: false
        default: ""
      exclude:
        description: "Space-separated checker IDs to skip (used with checks: 'all')"
        type: string
        required: false
        default: ""
      continue-on-failure:
        description: "Continue running checks even if one fails"
        type: boolean
        required: false
        default: false
      strict:
        description: "Treat warnings as failures (exit code 1)"
        type: boolean
        required: false
        default: false
      config:
        description: "Path to .quality-gate.yml (relative to project root)"
        type: string
        required: false
        default: ".quality-gate.yml"
      corpus-repo:
        description: "GitHub repository for the IJS corpus (e.g., jpurnell/org-judgement-corpus)"
        type: string
        required: false
        default: ""
      corpus-branch:
        description: "Branch in the corpus repo to push telemetry to"
        type: string
        required: false
        default: "main"
      runner:
        description: "runs-on value as a JSON array string, e.g. '[\"macos-latest\"]' or '[\"self-hosted\",\"macos\",\"quality-gate\"]' — every label listed must be present on the target runner"
        type: string
        required: false
        default: '["macos-latest"]'
      self-hosted:
        description: "Set true for self-hosted runners: skips the GitHub-hosted toolchain setup, and installs without sudo or writes to system locations"
        type: boolean
        required: false
        default: false
      # Until 2026-09-29 the build step cloned this repo's default branch unconditionally, so
      # pointing a caller at `...@some-branch` changed only which YAML ran — the *binary* was
      # still built from `main`. A change to a checker therefore could not be tested before it
      # landed on `main` and reached every repo at once, and worse, an attempt to test one
      # produced a confident result about code that was never in the run. Both happened while
      # fixing the search-path bug in this release, and the wrong conclusion was drawn twice.
      fail-on-findings:
        description: "Fail the job when the gate reports failures (exit 1). On by default; set false only for an audit-only caller. A gate that crashes or cannot run fails the job regardless."
        type: boolean
        required: false
        # On since 2026-10-21. It shipped off for one day so the crash fix would not turn the
        # fleet red at the same moment; a gate whose failures leave the job green is the
        # defect that fix was about, so off cannot be the default.
        default: true
      gate-ref:
        description: "Branch, tag or SHA of quality-gate-swift to build the gate from. Defaults to main; set it to verify a gate change before merging."
        type: string
        required: false
        default: main
    secrets:
      corpus-deploy-key:
        description: "SSH private key with write access to the corpus repo (preferred transport)"
        required: false
      dependency-token:
        description: "PAT with read access to private SPM dependencies (only if `swift build` resolves private URLs)"
        required: false
      corpus-token:
        description: "DEPRECATED — the old dual-purpose PAT. Superseded by corpus-deploy-key + dependency-token; still accepted so existing callers keep working through the migration."
        required: false

permissions:
  contents: read
  issues: write

jobs:
  quality-gate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout project
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # --- GitHub-hosted setup. A self-hosted runner brings its own toolchain,
      # --- and must not have CI install one over it.
      # No separate toolchain install: Xcode's own compiler builds AND audits.
      #
      # Until 2026-09-28 this step installed Swift 6.2 onto PATH while Xcode supplied 6.3.3,
      # and the two disagreed inside a single job — `swift build` resolved 6.2.1 from PATH,
      # `xcrun -f swiftc` answered with Xcode's 6.3.3, and the doc auditors then typechecked
      # against a compiler that could not load the module the build had just written. That
      # arrives as `no such module '<Module>'`: a tooling fact wearing the costume of a
      # documentation defect, which is the failure this repo exists to refuse.
      #
      # 6.4 was tried first, to match what the fleet develops against, and is not installable:
      # `swift-actions/setup-swift` reports `Version "6.4" is not available`. Pinning 6.3.3
      # explicitly would work today and rot the moment the runner image moves, which is how the
      # 6.2 pin outlived its own correctness. Taking the toolchain from Xcode means there is no
      # version string here to drift — `xcode-version: latest-stable` above already decides it,
      # in one place, and whatever it decides is what both halves use.
      #
      # `Toolchain.swiftcOnPath` is the other half of the same guarantee: it resolves the
      # compiler from PATH so the auditors follow the build rather than Xcode, and rejects
      # `/usr/bin/swiftc` as the shim it is. Either mechanism alone leaves a gap; both together
      # mean the build and the audit cannot silently disagree again.

      # The cache key has to name the gate's own source, and until 2026-09-29 it did not:
      # `hashFiles('.github/workflows/*.yml')` hashes the *caller's* workflow files, so no change
      # to this repo ever invalidated a consumer's cached binary. A repo could run a months-old
      # gate and report green, and a verification run reused a binary built before the very fix
      # it was meant to test — which is how a fix that had never executed was recorded as
      # disproved. Resolving the ref to a SHA makes the key move when the gate moves.
      - name: Resolve the gate revision
        if: ${{ !inputs.self-hosted }}
        id: qg-rev
        env:
          GATE_REF: ${{ inputs.gate-ref }}
        run: |
          SHA=$(git ls-remote https://github.com/jpurnell/quality-gate-swift.git "$GATE_REF" | cut -f1)
          # A SHA passed as the ref has nothing to resolve, so fall back to the ref itself.
          if [ -z "$SHA" ]; then SHA="$GATE_REF"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "gate source: $GATE_REF -> $SHA"

      # The cache holds the whole install — the binary *and* the resource bundles beside it —
      # and until 2026-10-21 it held the binary alone. `Bundle.module` looks next to the
      # executable first and then at the absolute path it was built at, so on a cache miss the
      # binary found its bundles in `/tmp/quality-gate-swift/.build` by accident, and on every
      # cache hit that tree did not exist and the first checker to read a resource died:
      #
      #   DependencyAdvisory/resource_bundle_accessor.swift:12: Fatal error: could not load resource bundle
      #
      # The run step then swallowed the crash (below), so the job reported success. `v2` in the
      # key keeps a binary-only entry from ever being restored again.
      - name: Cache quality-gate install
        if: ${{ !inputs.self-hosted }}
        id: qg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.quality-gate/bin
          key: quality-gate-v2-${{ steps.qg-rev.outputs.sha }}-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Configure git auth for private dependencies
        # Hosted only. This rewrites GLOBAL git config to inject a token; on a
        # self-hosted runner that is someone's actual machine, and it already has
        # the owner's credentials. CI does not get to edit them.
        if: ${{ !inputs.self-hosted }}
        # Must run on every job (not only cache-miss): the project's own
        # `swift build` in "Run quality gate" resolves private URL dependencies
        # and needs the token rewrite even when the quality-gate binary is cached.
        #
        # This rewrite is indiscriminate — it redirects *every* github.com HTTPS
        # URL through the supplied token. That is why the corpus credential no
        # longer arrives here: a corpus-scoped PAT in this position was offered
        # to every dependency host and could authorize none of them.
        env:
          DEPENDENCY_TOKEN: ${{ secrets.dependency-token }}
          LEGACY_TOKEN: ${{ secrets.corpus-token }}
        run: |
          git config --global submodule.recurse false
          git config --global fetch.recurseSubmodules false

          GH_TOKEN="$DEPENDENCY_TOKEN"
          if [ -z "$GH_TOKEN" ] && [ -n "$LEGACY_TOKEN" ]; then
            echo "::warning::Using deprecated 'corpus-token' for dependency auth. Pass 'dependency-token' instead; 'corpus-token' will be removed."
            GH_TOKEN="$LEGACY_TOKEN"
          fi

          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Configure corpus SSH transport
        if: inputs.corpus-repo != ''
        env:
          DEPLOY_KEY: ${{ secrets.corpus-deploy-key }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "No corpus-deploy-key supplied — falling back to token transport."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          # printf, not echo: the key is multi-line and must land byte-exact,
          # and a missing trailing newline makes ssh reject it as malformed.
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/qg_corpus"
          chmod 600 "$HOME/.ssh/qg_corpus"
          ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          # IdentitiesOnly stops ssh from offering the runner's other keys first
          # and tripping GitHub's "Too many authentication failures" cutoff.
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/qg_corpus -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          echo "CORPUS_TRANSPORT=ssh" >> "$GITHUB_ENV"

      - name: Build quality-gate from ${{ inputs.gate-ref }}
        # Hosted only: a self-hosted runner keeps its owner's install (below).
        if: ${{ !inputs.self-hosted && steps.qg-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 25
        env:
          GIT_SUBMODULE_STRATEGY: none
          GATE_REF: ${{ inputs.gate-ref }}
        run: |
          git clone --depth 1 --no-recurse-submodules --branch "$GATE_REF" https://github.com/jpurnell/quality-gate-swift.git /tmp/quality-gate-swift
          cd /tmp/quality-gate-swift
          swift build -c release 2>&1 | tee /tmp/qg-build.log | tail -20
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::quality-gate build failed (exit $BUILD_EXIT). Last 50 lines:"
            tail -50 /tmp/qg-build.log
            exit $BUILD_EXIT
          fi
          # `--show-bin-path`, not `.build/release`: the swiftbuild backend writes to `.build/out`
          # and the symlink that papers over it is not promised (see linux.yml).
          BIN="$(swift build -c release --show-bin-path --disable-automatic-resolution)"
          INSTALL="$HOME/.quality-gate/bin"
          mkdir -p "$INSTALL"
          cp "$BIN/quality-gate" "$INSTALL/"
          # Every bundle the build wrote, from every package — not `quality-gate-swift_*` alone.
          # Either spelling: `.bundle` or `.resources` follows the build system, not the OS.
          find "$BIN" -maxdepth 1 \( -name '*.bundle' -o -name '*.resources' \) -exec cp -R {} "$INSTALL/" \;
          # The manifest is what "Verify the install" checks a restored cache against.
          (cd "$INSTALL" && find . -maxdepth 1 \( -name '*.bundle' -o -name '*.resources' \) | sort > bundles.txt)
          echo "quality-gate built from $(git rev-parse --short HEAD) with $(wc -l < "$INSTALL/bundles.txt" | tr -d ' ') resource bundles"

      - name: Verify the install
        # Runs on a cache hit as well as a miss, which is the point: the hit is the path that
        # broke, and nothing exercised it. A bundle that is missing here is a crash later.
        if: ${{ !inputs.self-hosted }}
        run: |
          INSTALL="$HOME/.quality-gate/bin"
          [ -x "$INSTALL/quality-gate" ] || { echo "::error::no quality-gate binary at $INSTALL"; exit 1; }
          [ -s "$INSTALL/bundles.txt" ] || { echo "::error::$INSTALL has no bundle manifest — the install predates bundle caching or the build wrote no bundles"; exit 1; }
          missing=0
          while read -r bundle; do
            [ -d "$INSTALL/$bundle" ] || { echo "::error::resource bundle missing from the install: $bundle"; missing=1; }
          done < "$INSTALL/bundles.txt"
          [ "$missing" -eq 0 ] || exit 1
          echo "$INSTALL" >> "$GITHUB_PATH"
          echo "install verified: binary + $(wc -l < "$INSTALL/bundles.txt" | tr -d ' ') resource bundles (cache hit: ${{ steps.qg-cache.outputs.cache-hit == 'true' }})"

      - name: Ensure quality-gate (self-hosted)
        # Self-hosted path: prefer whatever the owner already installed, and only
        # build if there is nothing on PATH. Installs to a user-writable directory
        # so this never needs sudo and never writes to a system location.
        #
        # The clone is unauthenticated because quality-gate-swift is public as of
        # 2026-09-08. It was private when this step was first written, which is why
        # the hosted path still carries a token rewrite and this one does not.
        if: ${{ inputs.self-hosted }}
        timeout-minutes: 25
        run: |
          if command -v quality-gate >/dev/null 2>&1; then
            echo "Using pre-installed quality-gate at $(command -v quality-gate)"
            quality-gate --version || true
          else
            echo "quality-gate not on PATH; building from latest main"
            rm -rf "$RUNNER_TEMP/quality-gate-swift"
            git clone --depth 1 --no-recurse-submodules \
              https://github.com/jpurnell/quality-gate-swift.git "$RUNNER_TEMP/quality-gate-swift"
            cd "$RUNNER_TEMP/quality-gate-swift"
            swift build -c release 2>&1 | tee "$RUNNER_TEMP/qg-build.log" | tail -20
            BUILD_EXIT=${PIPESTATUS[0]}
            if [ "$BUILD_EXIT" -ne 0 ]; then
              echo "::error::quality-gate build failed (exit $BUILD_EXIT). Last 50 lines:"
              tail -50 "$RUNNER_TEMP/qg-build.log"
              exit "$BUILD_EXIT"
            fi
            # Its own directory, with its bundles beside it: `$RUNNER_TEMP` is cleaned between
            # jobs, so a binary copied out alone would find its resources only until then.
            BIN="$(swift build -c release --show-bin-path --disable-automatic-resolution)"
            INSTALL="$HOME/.local/lib/quality-gate"
            mkdir -p "$INSTALL"
            cp "$BIN/quality-gate" "$INSTALL/"
            find "$BIN" -maxdepth 1 \( -name '*.bundle' -o -name '*.resources' \) -exec cp -R {} "$INSTALL/" \;
            echo "$INSTALL" >> "$GITHUB_PATH"
            echo "quality-gate built from $(git rev-parse --short HEAD)"
          fi

      - name: Checkout corpus
        if: inputs.corpus-repo != ''
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.corpus-token }}
        run: |
          if [ "$CORPUS_TRANSPORT" = "ssh" ]; then
            git clone --depth 1 --branch ${{ inputs.corpus-branch }} \
              "git@github.com:${{ inputs.corpus-repo }}.git" _corpus
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::corpus-repo is set but no corpus credential was supplied. Pass corpus-deploy-key."
            exit 1
          fi
          echo "::warning::Cloning corpus over the deprecated token transport. Pass 'corpus-deploy-key' instead."
          git clone --depth 1 --branch ${{ inputs.corpus-branch }} \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.corpus-repo }}.git" \
            _corpus

      - name: Run quality gate
        id: qg-run
        timeout-minutes: 90
        run: |
          ARGS=""

          if [ -n "${{ inputs.checks }}" ]; then
            for check in ${{ inputs.checks }}; do
              ARGS="$ARGS --check $check"
            done
          fi

          if [ -n "${{ inputs.exclude }}" ]; then
            for exc in ${{ inputs.exclude }}; do
              ARGS="$ARGS --exclude $exc"
            done
          fi

          if [ -f "${{ inputs.config }}" ]; then
            ARGS="$ARGS --config ${{ inputs.config }}"
          fi

          if [ "${{ inputs.continue-on-failure }}" = "true" ]; then
            ARGS="$ARGS --continue-on-failure"
          fi

          if [ "${{ inputs.strict }}" = "true" ]; then
            ARGS="$ARGS --strict"
          fi

          # Write telemetry directly to corpus checkout if available
          if [ -d "_corpus" ]; then
            ARGS="$ARGS --telemetry-corpus-path $(pwd)/_corpus"
          fi

          echo "Running: quality-gate $ARGS"
          # Until 2026-10-21 this line was `quality-gate $ARGS || echo "exit_code=$?" >> ...`,
          # and nothing read `exit_code`. Every outcome — findings, a bad config, a crash —
          # finished the step green. That is how a gate that died on its first resource read
          # was reported as a passing run across the fleet.
          #
          # The gate exits 0 when it passes and 1 when it reports failures. Anything else is the
          # gate not having run: a fatal error (SIGTRAP, 133), a signal, an argument error.
          # That always fails the job; there is no verdict to continue past.
          set +e
          quality-gate $ARGS
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          case "$STATUS" in
            0) echo "quality gate passed." ;;
            1)
              if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
                echo "::error::quality gate reported failures."
                exit 1
              fi
              echo "::warning::quality gate reported failures (fail-on-findings is false for this caller, so the job stays green)."
              ;;
            *)
              echo "::error::quality-gate did not complete (exit $STATUS). This is the tool failing, not a verdict on the project."
              exit "$STATUS"
              ;;
          esac

      - name: Push telemetry to corpus
        if: inputs.corpus-repo != '' && always()
        timeout-minutes: 2
        run: |
          if [ ! -d "_corpus" ]; then
            echo "Corpus directory not found — skipping telemetry push."
            exit 0
          fi
          cd _corpus
          git config user.name "quality-gate[bot]"
          git config user.email "quality-gate[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi

          COMMIT_MSG="telemetry: ${{ github.repository }}@$(echo ${{ github.sha }} | cut -c1-7)"

          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            git commit -m "$COMMIT_MSG" || true
            if git push origin ${{ inputs.corpus-branch }}; then
              echo "Telemetry pushed successfully (attempt $attempt)."
              exit 0
            fi
            echo "Push conflict (attempt $attempt/$MAX_RETRIES), rebasing..."
            git pull --rebase origin ${{ inputs.corpus-branch }}
          done

          echo "::warning::Telemetry push failed after $MAX_RETRIES attempts."
          exit 0

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Quality Gate failure: ${{ github.repository }}"
          BODY="**Nightly quality gate failed** on $(date -u +%Y-%m-%d).

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}

          This issue was opened automatically by the quality-gate workflow."

          EXISTING=$(gh issue list --state open --search "in:title \"Quality Gate failure\"" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            # A fresh repo has no "ci-failure" label, and `gh issue create --label`
            # fails outright on an unknown one — which lost the failure report itself.
            # Ensure the label exists; if it cannot be created, open the issue unlabelled.
            if gh label create "ci-failure" --color B60205 \
                 --description "Opened automatically by a failed CI quality gate" --force >/dev/null 2>&1; then
              gh issue create --title "$TITLE" --body "$BODY" --label "ci-failure"
            else
              echo "::warning::Could not create the ci-failure label; opening the issue without it."
              gh issue create --title "$TITLE" --body "$BODY"
            fi
            echo "Opened new failure issue"
          fi

      - name: Remove corpus deploy key (self-hosted)
        # A hosted runner is destroyed after the job, so the key written by
        # "Configure corpus SSH transport" goes with it. A self-hosted runner is
        # someone's machine and keeps whatever CI leaves behind — so the key has to
        # be removed explicitly, and on every path out of the job, including failure.
        if: ${{ always() && inputs.self-hosted }}
        run: |
          rm -f "$HOME/.ssh/qg_corpus"
          echo "Corpus deploy key removed from $HOME/.ssh"
