excludePatterns:
  # Test fixtures contain intentionally dead code that exists to drive
  # the auditor's own reachability tests; auditing them as part of the
  # outer package would always fail the gate.
  - "**/Tests/UnreachableCodeAuditorTests/Fixtures/**"

# docTarget is deliberately unset. Setting it pins doc-lint to one module and says nothing
# about the rest — this package had it pinned to QualityGateCore, so a green doc-lint was a
# statement about 1 target of 116 while the other 115 were never handed to DocC. Unset, every
# target owning a .docc catalogue is checked.

build:
  solverExpressionTimeThreshold: 500

logging:
  projectType: cli

security:
  # CLI tool operates on configured paths (not user input) and spawns
  # hardcoded system processes — path-traversal, command-injection, and
  # insecure-transport are false positives in this context.
  #
  # What that reasoning missed, recorded 2026-08-16. security.command-injection
  # is named and worded for injection ("validate and sanitize dynamic
  # arguments") but its mechanism is `callee == "Process"` — it flags EVERY
  # Process/NSTask construction and never inspects an argument. The injection
  # judgement above is sound; disabling the rule on that basis also removed the
  # only signal pointing at every direct Process() site in the tree. Nine were
  # sitting there unbounded, and one of them cost 46 minutes to a hang.
  # Re-enabling as-is is not the fix — the rule needs splitting into an
  # injection rule that earns its name and a containment rule that keeps the
  # construction signal. See project/plans/proposals/
  # ProcessSafetyAuditorCatchesTheClass.md.
  enabledRules:
    - security.hardcoded-secret
    - security.weak-crypto
    - security.eval-js
    - security.sql-injection
    - security.insecure-keychain
    - security.tls-disabled
    - security.ssrf

dependencyAudit:
  allowBranchPins:
    - indexstore-db
    - swift-lmdb

consistency:
  corpusPath: /Users/jpurnell/Dropbox/Computer/Development/Swift/Tools/org-judgement-corpus
  projectID: quality-gate-swift
  consistencyThreshold: 0.7
  defaultRiskTier: 2

ijs:
  projectID: "quality-gate-swift"
  corpusPath: "/Users/jpurnell/Dropbox/Computer/Development/Swift/Tools/org-judgement-corpus"
  decisionOwner: "jpurnell"
  defaultRiskTier: 2
  remoteURL: "git@github.com:jpurnell/org-judgement-corpus.git"

# Phase 0.6: refuse to run a binary older than this under --strict.
# Ratchet when the repo starts depending on new gate rules.
minimumGateVersion: "2026-07-10"

# Facts the tree cannot supply. A repository URL read from `git remote` and a tag name read
# from `git tag` are both refs, and a verdict that moves with a shallow clone is not hermetic.
doc-generated:
  repositoryURL: "https://github.com/jpurnell/quality-gate-swift"
  # Settled at 3.0.0: the semver tags (`v1.0.0`, `v2.0.1`, `v2.0.2`, `v3.0.0`) carry a `v` and
  # the two date-style tags (`2026.07.10`, `2026.07.12`) are the outliers, so `v` is the
  # convention going forward. Compare *bases* pointing at those two, and at tags never pushed,
  # still resolve to nothing — a link cannot be made correct by naming a ref that does not
  # exist, and this checker cannot see refs to tell you so.
  tagPrefix: "v"

# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# A stamp naming its own commit cannot be right inside that commit, so the tracked file holds a
# placeholder and the build scripts overwrite-then-restore it. That has failed twice (`d644d35`,
# `d0278e9`), and both times the wrong value was invisible until someone read a diff. This makes
# it loud instead — Tier-1 custom rules gate by their declared severity.
customRules:
  - id: house.build-stamp-committed
    pattern: '"[0-9a-f]{40}"'
    include:
      - "Sources/QualityGateCLI/BuildStamp.swift"
    message: "BuildStamp.swift holds a real commit hash. It is generated at build time and restored afterwards; a hash here is a stamp that was committed, and it can never name the commit it sits in. Restore the placeholder: git checkout -- Sources/QualityGateCLI/BuildStamp.swift"
    severity: error
